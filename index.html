<script>try{var t=sessionStorage.getItem("theme")||"light";document.documentElement.setAttribute("data-theme",t)}catch(e){document.documentElement.setAttribute("data-theme","light")}</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='6' width='52' height='52' rx='12' fill='%23fff' stroke='%23111' stroke-width='5'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-size='32' font-weight='800' font-family='Arial' fill='%23111'%3ER%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&family=Space+Mono:wght@400;700&family=Unbounded:wght@800&display=swap" rel="stylesheet" />
<style>
html{scroll-behavior:auto;background:#fff}html[data-theme=dark]{background:#141414}
body{margin:0;background:inherit;overflow-x:hidden}
#app{display:block}.bd{display:block;margin-inline:auto;overflow:clip}
.wipe{position:fixed;inset:0;z-index:150;pointer-events:none;visibility:hidden;--e2:cubic-bezier(.76,0,.24,1);background:#111 radial-gradient(#fff 1px,transparent 1.4px) 0 0/22px 22px;color:#fff;display:grid;place-items:center;font:800 clamp(28px,8vw,72px) Unbounded,sans-serif;letter-spacing:.2em;transform:translateY(101%);border-radius:40px 40px 0 0;will-change:transform}
.wipe.fromtop{transform:translateY(-101%);border-radius:0 0 40px 40px}
.wipe.on,.wipe.off{visibility:visible}
.wipe.on{transform:translateY(0);border-radius:0;transition:transform .5s var(--e2),border-radius .5s var(--e2)}
.wipe.off{transform:translateY(-101%);border-radius:0 0 40px 40px;transition:transform .6s var(--e2),border-radius .6s var(--e2)}
.wipe.fromtop.off{transform:translateY(101%);border-radius:40px 40px 0 0}
.wipe span{opacity:0;transform:scale(.9);letter-spacing:.35em;transition:opacity .3s,transform .5s var(--e2),letter-spacing .5s var(--e2)}
.wipe.on span{opacity:1;transform:none;letter-spacing:.2em;transition-delay:.18s}.wipe.off span{opacity:0;transform:scale(1.06)}
.totop{position:fixed;right:16px;bottom:16px;z-index:60;width:42px;height:42px;display:grid;place-items:center;border:2px solid #111;border-radius:12px;background:#fff;color:#111;box-shadow:3px 3px 0 #111;font:700 18px "Space Mono",monospace;text-decoration:none;opacity:0;pointer-events:none;transition:opacity .3s}
.totop.show{opacity:1;pointer-events:auto}
html[data-theme=dark] .totop{filter:invert(.92) hue-rotate(180deg)}
.skip{position:absolute;left:-999px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:300;background:#111;color:#fff;border-radius:10px;padding:10px 16px;font:700 12px "Space Mono",monospace;transition:.3s;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%)}
@media(prefers-reduced-motion:reduce){.wipe{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="menu" aria-hidden="true"></div>
<a class="totop" href="#home" aria-label="Back to top" data-top>↑</a>
<div class="wipe" aria-hidden="true"><span>RENAD</span></div>
<div class="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px;font-family:sans-serif">Please enable JavaScript to view this portfolio.</p></noscript>
<script src="boards.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
